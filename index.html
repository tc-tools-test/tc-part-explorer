<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part Explorer</title>
  <link rel="stylesheet" href="style.css">
  <!-- Trimble Connect Workspace API (official CDN). Exposes global TrimbleConnectWorkspace -->
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
</head>
<body>
  <header>
    <button id="refreshBtn" disabled>部材を読み込み</button>
    <span id="connStatus" class="muted">接続中...</span>
  </header>

  <input id="searchBox" type="search" placeholder="Name / Profile / Material で検索" disabled>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Name</th><th>Profile</th><th>Material</th></tr>
      </thead>
      <tbody id="partsBody"></tbody>
    </table>
  </div>

  <footer id="status" class="muted"></footer>

  <script src="app.js"></script>
</body>
</html>
